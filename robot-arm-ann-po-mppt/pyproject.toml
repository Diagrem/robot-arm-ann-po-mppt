[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-arm-ann-po-mppt-reference"
version = "0.1.0"
description = "Thesis-informed MPPT comparison reference code (not original experimental source)"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3,<2.0",
    "matplotlib>=3.7,<4.0",
    "numpy>=1.24,<3.0",
    "pyserial>=3.5,<4.0",
    "scikit-learn>=1.3,<2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mppt_reference*"]
